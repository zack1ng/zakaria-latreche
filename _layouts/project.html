---
layout: default
---
<div class="detail-head">
  <h1>{{ page.title }}</h1>
  <div class="tag {{ page.status }}">{{ page.status | upcase }}</div>
</div>

<div class="detail-hero">
  {% if page.image %}
    <video autoplay muted loop playsinline src="{{ page.image | relative_url }}"></video>
  {% else %}
    <span>preview</span>
  {% endif %}
</div>

<div class="detail-keywords">
  {% for tag in page.tags %}
    <span>{{ tag }}</span>
  {% endfor %}
</div>

<div class="detail-body">
  {{ content }}
</div>
